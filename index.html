<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Svitlana Yavorska | UGC Creator</title>
  </head>
  <body class="antialiased">
    <!-- Navigation -->
    <nav
      class="fixed w-full top-0 z-50 bg-brand-sand/90 backdrop-blur-sm border-b border-brand-brown/10"
    >
      <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="#" id="dynamic-logo" class="flex flex-col items-center justify-center text-brand-brown transition-transform hover:scale-105 min-h-[32px]">
        </a>

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center space-x-4 lg:space-x-8 text-[11px] lg:text-sm uppercase tracking-widest text-brand-dark/70">
          <div id="desktop-nav" class="flex space-x-4 lg:space-x-8"></div>

          <!-- Language Switcher Desktop -->
          <div class="flex space-x-2 lg:space-x-3 text-[10px] lg:text-xs border-l border-brand-brown/20 pl-4 lg:pl-8">
            <button class="lang-btn hover:text-brand-brown transition-colors" data-lang="nl">NL</button>
            <span class="opacity-30">|</span>
            <button class="lang-btn hover:text-brand-brown transition-colors" data-lang="en">EN</button>
          </div>
        </div>

        <!-- Mobile Menu Button -->
        <button
          id="mobile-menu-btn"
          class="md:hidden text-brand-brown focus:outline-none"
          aria-label="Toggle Menu"
        >
          <svg
            id="menu-icon"
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              class="menu-open"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
            <path
              class="menu-close hidden"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div
      id="mobile-menu"
      class="md:hidden fixed inset-0 z-40 bg-brand-sand/98 backdrop-blur-xl flex flex-col justify-center items-center space-y-10 text-xl font-light uppercase tracking-[0.2em] text-brand-brown opacity-0 pointer-events-none transition-all duration-500 ease-in-out"
    >
      <div id="mobile-nav-links" class="flex flex-col items-center space-y-10 w-full">
      </div>

      <!-- Language Switcher Mobile -->
      <div class="flex space-x-6 text-sm mt-8 border-t border-brand-brown/20 pt-8 w-1/3 justify-center">
        <button class="lang-btn hover:text-brand-brown transition-colors" data-lang="nl">NL</button>
        <span class="opacity-30">|</span>
        <button class="lang-btn hover:text-brand-brown transition-colors" data-lang="en">EN</button>
      </div>
    </div>

    <!-- Hero Section -->
    <section
      class="min-h-screen flex flex-col justify-center items-center text-center px-6 pt-20 relative"
    >
      <h1 id="hero-title" class="text-7xl md:text-8xl lg:text-9xl text-cursive text-brand-brown mb-4 md:mb-12 min-h-[100px]"></h1>
      <p id="hero-subtitle" class="text-xl md:text-2xl uppercase tracking-[0.3em] text-brand-dark/80 font-light mt-4 min-h-[32px]"></p>

      <!-- Minimalist Scroll Down Button -->
      <a
        href="#about"
        class="absolute bottom-20 left-1/2 -translate-x-1/2 flex flex-col items-center text-brand-brown opacity-60 hover:opacity-100 transition-opacity animate-bounce"
        aria-label="Scroll to About section"
      >
        <span class="text-[10px] uppercase tracking-[0.3em] font-light mb-2">
          Scroll
        </span>
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M19 9l-7 7-7-7"
          ></path>
        </svg>
      </a>
    </section>

    <!-- About Section -->
    <section id="about" class="py-24 px-6 max-w-6xl mx-auto">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
        <div
          class="aspect-3/4 bg-white/30 rounded-xl overflow-hidden shadow-lg relative"
        >
          <img
            id="about-image"
            src=""
            alt=""
            class="w-full h-full object-cover hidden"
          />
        </div>
        <div>
          <h2 id="about-title" class="text-5xl text-cursive text-brand-brown mb-8 min-h-[48px]"></h2>
          <div id="about-text">
            <!-- Dynamic text injected here -->
          </div>
        </div>
      </div>
    </section>

    <!-- Services & Niche -->
    <section id="services" class="py-24 px-6 bg-brand-brown text-brand-sand">
      <div
        class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-16 text-center md:text-left"
      >
        <div class="flex flex-col items-center md:items-start">
          <h2 id="services-title" class="text-6xl text-cursive mb-12 min-h-[60px]"></h2>
          <ul id="services-list" class="space-y-4 font-light text-lg opacity-90 text-left w-72 mx-auto md:w-auto md:mx-0">
          </ul>
        </div>
        <div class="flex flex-col items-center md:items-start">
          <h2 id="niche-title" class="text-6xl text-cursive mb-12 min-h-[60px]"></h2>
          <ul id="niche-list" class="space-y-4 font-light text-lg opacity-90 text-left w-72 mx-auto md:w-auto md:mx-0">
          </ul>
        </div>
      </div>
    </section>

    <!-- Portfolio Section -->
    <section id="portfolio" class="py-24 px-6 max-w-7xl mx-auto">
      <div class="text-center mb-16">
        <h2 id="portfolio-subtitle" class="text-xs uppercase tracking-[0.2em] mb-4 text-brand-dark/60">
          Portfolio
        </h2>
        <h3 id="portfolio-title" class="text-6xl text-cursive text-brand-brown">Selected Work</h3>
        <p id="portfolio-description" class="mt-4 text-lg font-light text-brand-dark/70">
          A collection of product photos and short-form videos.
        </p>
      </div>

      <!-- Phone mockup slider for vertical videos -->
      <div
        class="flex overflow-x-auto gap-4 sm:gap-8 py-12 px-4 sm:px-8 -mx-4 sm:-mx-8 snap-x snap-mandatory scroll-smooth [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] scrollbar-none"
        id="portfolio-grid"
      >
        <!-- Dynamic content will be injected here by main.js -->
      </div>
    </section>

    <!-- Contact Section -->
    <!-- Contact Section -->
    <section id="contact" class="py-20 md:py-32 px-6 border-t border-brand-brown/10 text-center">
      <div class="max-w-3xl mx-auto flex flex-col items-center gap-4 relative z-10">

        <h2 id="contact-title" class="text-5xl text-cursive text-brand-brown mb-2 min-h-12"></h2>
        <p id="contact-subtitle" class="text-xl font-light text-brand-dark/80 mb-6 min-h-7"></p>

        <div id="contact-social-links" class="flex flex-col items-center gap-4 text-lg">
          <!-- Dynamic social links injected here -->
        </div>

        <div class="mt-8">
          <a id="contact-button" href="#" class="inline-block px-10 py-4 bg-brand-brown text-brand-sand uppercase tracking-widest text-sm hover:bg-brand-dark transition-colors">
            Get in touch →
          </a>
        </div>

      </div>
    </section>

    <!-- Footer -->
    <footer class="py-8 text-center text-sm font-light opacity-50">
      <p>
        &copy;
        <span id="year"></span>
        Svitlana Yavorska. All rights reserved.
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
